[mcp_servers.nix-config-project]
command = "bun"
args = ["mcp/src/server.ts"]
cwd = "/home/yashindo/nix-config"

[mcp_servers.nix-config-project.env]
NIX_CONFIG_MCP_ROOT = "/home/yashindo/nix-config"

[mcp_servers.nix-config-project.tools.apply_approved_patch]
approval_mode = "approve"

[mcp_servers.nix-config-project.tools.git_commit_files]
approval_mode = "approve"

[mcp_servers.nix-config-project.tools.read_authority_contract]
approval_mode = "approve"

[mcp_servers.nix-config-project.tools.read_project_overview]
approval_mode = "approve"

[mcp_servers.nix-config-project.tools.find_nix_references]
approval_mode = "approve"

[mcp_servers.nix-config-project.tools.validate_declarative_contract]
approval_mode = "approve"

[mcp_servers.graphify]
command = "pipenv"
args = ["run", "python", "-m", "graphify.serve", "graphify-out/graph.json"]
cwd = "/home/yashindo/nix-config"
