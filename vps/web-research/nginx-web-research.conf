# Web research services: NetBird VPN/local access only.

server {
    listen 80;
    listen [::]:80;
    server_name search.yashindo.syn-forge.com crawl.yashindo.syn-forge.com crawl-mcp.yashindo.syn-forge.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name search.yashindo.syn-forge.com;

    ssl_certificate /etc/letsencrypt/live/wildcard-yashindo-syn-forge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wildcard-yashindo-syn-forge/privkey.pem;

    location / {
        allow 127.0.0.1;
        allow ::1;
        allow 10.17.0.0/16;
        allow fd7a:54fe:a7cc:2ced::/64;
        deny all;
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crawl.yashindo.syn-forge.com;

    ssl_certificate /etc/letsencrypt/live/wildcard-yashindo-syn-forge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wildcard-yashindo-syn-forge/privkey.pem;
    client_max_body_size 16m;

    location / {
        allow 127.0.0.1;
        allow ::1;
        allow 10.17.0.0/16;
        allow fd7a:54fe:a7cc:2ced::/64;
        deny all;
        proxy_pass http://127.0.0.1:9300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1d;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crawl-mcp.yashindo.syn-forge.com;

    ssl_certificate /etc/letsencrypt/live/wildcard-yashindo-syn-forge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wildcard-yashindo-syn-forge/privkey.pem;

    location / {
        allow 127.0.0.1;
        allow ::1;
        allow 10.17.0.0/16;
        allow fd7a:54fe:a7cc:2ced::/64;
        deny all;
        proxy_pass http://127.0.0.1:9320;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 1d;
        proxy_buffering off;
    }
}
